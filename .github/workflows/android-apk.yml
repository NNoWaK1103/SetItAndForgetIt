name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test market-data adapter (offline fixtures)
        run: node --test server/*.test.mjs server/cloudflare/*.test.mjs
      - name: Validate serverless proxy bundle (no deployment or secrets required)
        working-directory: server/cloudflare
        run: |
          npm ci
          npm run check
      - name: Reuse debug signing identity for tablet updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openticker-debug-signing-v1
      - name: Test, lint, and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OpenTicker-check-reports
          path: app/build/reports/
      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: OpenTicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"
