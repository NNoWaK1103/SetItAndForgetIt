name: Android tablet preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-preview.yml
      - scripts/capture-preview.py
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build current app
        run: |
          python3 -m py_compile scripts/capture-preview.py
          ./gradlew --no-daemon assembleDebug
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual tablet screens and slideshow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -skin 1280x800 -memory 2048 -cores 2 -timezone America/New_York
          script: python3 scripts/capture-preview.py
      - name: Upload screenshots, video and runtime logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OpenTicker-tablet-preview
          path: preview-output/
          if-no-files-found: error
          retention-days: 30
